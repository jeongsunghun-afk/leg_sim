# biped_emb 설정 — 실기(Emb) 배포. 파라미터는 전부 여기(env-var 소거, quad_ctrl 원칙 3).
#   ★단위 규약: SHM 모터 = degree, biped 컨트롤러/MuJoCo = radian. joint_map 이 변환·부호·오프셋 담당.
#   ★부호(sign)·오프셋(offset_deg)은 실기 캘리브레이션 값 = jog 검증으로 축별 확정(초기값 +1 / 0).

meta:
  robot: biped_8dof              # HL/HR × (hip·thigh·calf·foot)
  model: ../biped_flatfoot.mjcf  # 동역학 모델(상태추정 FK·WBIC 재사용). emb/ 기준 상대경로
  ctrl_hz: 500                   # 제어 루프 주기[Hz]. jog=충분, 모델기반 고속보행만 1kHz(→C++ 이관)

# ── SHM(RobotSharedMem) 백엔드 ──────────────────────────────────────────────
shm:
  lib: /home/rpetubt/simulation/biped/emb/hal/libbipedshm.so  # hal/build_bridge.sh 산출물(Pi)
  n_channel: 10                  # Gait 채널 수(MAX_GaitMOT_CHAN). 0~7=다리, 8~9=허리
  recv_wait_ms: 2000             # 모터 상태 첫 수신 대기(RobotEmbedded 기동 확인). 초과=에러
  imu_deg: true                  # IMU RPY 단위(true=deg). 컨트롤러용 quat 변환 시 사용

# ── 관절 매핑: biped 컨트롤러 순서(0~7) → Gait 채널 ─────────────────────────
#   name    : biped 관절명(= robot_interface.JOINT_NAMES 순서, 고정)
#   channel : RobotSharedMem Gait 채널(ENUM_Gait_JointID)
#   sign    : 실모터 회전방향 = sign · (컨트롤러 각).
#             ★HL_hip·HR_hip = +1 **실측 확정**(2026-08-05, 육안 검증).
#               `+` 명령 시 두 축 모두 정면에서 볼 때 **반시계**로 회전한다.
#               MJCF hip `axis="1 0 0"` 은 정면 관찰자 쪽으로 +X 가 향하므로 오른손
#               법칙상 `+q` = 반시계 → 실측과 일치 ⇒ sign=+1 (부호 반전 불필요).
#               **좌우 거울 장착이 아니다** — 두 축을 동시에 같은 각도로 움직였을 때
#               같은 방향으로 회전함을 확인(이것이 결정적 관찰이었다).
#             ⚠ 나머지 6축은 미장착 → 여전히 미검증(기본 +1).
#   offset_deg: 실모터 0점 − 컨트롤러 0점[deg]. ★캘리브레이션
#   min/max_deg: 소프트웨어 관절한계[deg](MJCF range 변환). 명령·jog 모두 클램프
#   kp/kd   : jog·hold 시 모터 임피던스 게인(모델기반은 tau_ff, kp/kd=0)
#
#   ★★게인 단위 (2026-08-05 실기 실측). 드라이버 MIT 법칙은
#        tau[Nm] = Kp·(q_des − q)[rad] + Kd·(dq_des − dq)[rad/s]
#     명령/상태는 deg 지만 게인은 rad 기준 → Kp 1 당 0.0175 Nm/deg 밖에 안 된다.
#     실측(ch0=HL_hip): err 4.743deg(0.0828rad), vel 0.61deg/s, Kp10/Kd5
#        → 예측 10·0.0828 − 5·0.0106 = 0.775 Nm, 실측 0.757 Nm (오차 2%).
#     ⇒ 종전 kp8 은 1° 오차당 0.14 Nm 로 힙 관절 정지마찰조차 못 이긴다
#       (±5° 명령에 실제 ±0.7° 만 움직여 "모터 무반응" 으로 오인했던 원인).
#     실측 정합: kp25 → ±4°, kp40/kd2 → 추종지연 1.4°, kp60/kd3 → 1.2°(채터 없음).
#   ⇒ hip 은 kp40/kd2 로 확정(실측). 나머지 축은 미장착이라 동일비율(×5) 외삽값이므로
#     장착 후 축별로 mot_test 로 재검증할 것. ⚠Kd 는 속도 노이즈(±15deg/s 관측)를
#     그대로 토크로 증폭하므로(kd2 → ±0.5Nm) 함부로 올리지 말 것.
joints:
  - {name: HL_hip,   channel: 0, sign:  1, offset_deg: 0.0, min_deg: -35, max_deg:  35, kp: 40, kd: 2.0}  # ★sign 실측확정 · 게인 실측 · offset 미확정(다리 장착 후)
  - {name: HL_thigh, channel: 1, sign:  1, offset_deg: 0.0, min_deg: -135, max_deg: 65, kp: 40, kd: 2.0}  # 외삽(미장착)
  - {name: HL_calf,  channel: 2, sign:  1, offset_deg: 0.0, min_deg: -55, max_deg:  65, kp: 40, kd: 2.0}  # 외삽(미장착)
  - {name: HL_foot,  channel: 3, sign:  1, offset_deg: 0.0, min_deg: -80, max_deg:  40, kp: 30, kd: 1.5}  # 외삽(미장착)
  - {name: HR_hip,   channel: 4, sign:  1, offset_deg: 0.0, min_deg: -35, max_deg:  35, kp: 40, kd: 2.0}  # ★sign 실측확정 · 게인 실측 · offset 미확정(다리 장착 후)
  - {name: HR_thigh, channel: 5, sign:  1, offset_deg: 0.0, min_deg: -135, max_deg: 65, kp: 40, kd: 2.0}  # 외삽(미장착)
  - {name: HR_calf,  channel: 6, sign:  1, offset_deg: 0.0, min_deg: -55, max_deg:  65, kp: 40, kd: 2.0}  # 외삽(미장착)
  - {name: HR_foot,  channel: 7, sign:  1, offset_deg: 0.0, min_deg: -80, max_deg:  40, kp: 30, kd: 1.5}  # 외삽(미장착)

# 허리(WaR/WaP, 채널 8~9)는 biped 모델에 없음 → 고정 홀드. ★상체/허리 서브시스템 별도면 여기서 제외.
waist:
  channels: [8, 9]
  hold_deg: [0.0, 0.0]           # 홀드 목표각
  kp: 50                         # 외삽(미장착) — 위 게인 단위 주석 참조
  kd: 2.5

# ── jog(각축 검증) ──────────────────────────────────────────────────────────
#   안전 우선: 저속 위치 램프. GUI가 축별 목표각(deg) 발행 → 여기 속도·한계로 제한.
jog:
  max_speed_dps: 20.0            # 축 최대 각속도[deg/s] — 천천히(안전)
  range_frac: 0.5               # 초기엔 관절한계의 이 비율까지만 허용(캘리브레이션 안전마진)
  settle_deg: 0.5               # 목표 도달 판정[deg]

# ── 안전 ────────────────────────────────────────────────────────────────────
safety:
  tau_max_frac: 0.6             # 모델기반 토크를 actuatorfrcrange 의 이 비율로 클램프
  tilt_estop_deg: 40            # 기울기 초과 시 안전정지(limp)
  watchdog_ms: 100              # 명령 채널 무응답 이 시간 초과 시 홀드→limp
