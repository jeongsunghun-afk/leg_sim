        -1.525, 7.31, 16.145, 24.979, 33.814, 42.649, 51.484, 60.318, 69.153, 77.988]
      tau: [-0.1482, -0.1402, -0.13, -0.1176, -0.1033, -0.0873, -0.0698, -0.0512, -0.0317, -0.0118, 0.0084,
        0.0284, 0.048, 0.0668, 0.0845, 0.1007, 0.1154, 0.1281, 0.1387, 0.147, 0.1529]
  tau_bias_by_ch: {0: -5.247, 1: 0.0, 2: -0.806, 3: -0.032,
                   4: 5.252, 5: -0.059, 6: 0.806, 7: 0.032}
  # ★축별 swing [Nm] — 바이어스 **주변** 진폭. 없으면 tau_max_nm(1.4).
  #   2026-08-12 HL_hip 실측: −dir 은 0.328 에서 파단했는데 +dir 은 1.4 까지 올려도 미동.
  #   즉 정지 밴드 [τ_req−f, τ_req+f] 의 **아래 경계만 잡고 위 경계를 못 잡았다**.
  #   밴드폭이 최소 1.72 Nm(=0.328+1.4) 이므로 마찰 f ≥ 0.86 — 다리 미장착 시절 값
  #   0.65 보다 크다(다리를 달아 베어링 하중이 늘었다면 그럴 수 있다).
  #   ⇒ hip 은 swing 을 2.5 로 키워 양쪽 경계를 모두 잡는다. 그래야 f=(τ⁺−τ⁻)/2 가 나온다.
  #   ⚠피크 |bias|+swing = 7.75 Nm < τ_trip 12.0 (ch0/4). 파단 즉시 토크 0 이라 폭주 안 한다.
  swing_by_ch: {0: 2.5, 4: 2.5}
  tau_max_nm: 1.4                     # 정지마찰 0.71 Nm 의 약 2배
  ramp_nm_per_s: 0.25                 # 느릴수록 파단 판정이 정확
  move_thresh_deg: 0.30               # 위치 변위 기준(속도 노이즈 ±15deg/s 라 속도로는 불가)
  trials: 2                           # 방향당

# ── 백래시·컴플라이언스 (act_measure_backlash.py) ───────────────────────────
#   순수 토크모드가 동작함이 확인돼(2026-08-05) 표준 토션 히스테리시스 시험이 성립한다.
#   ⚠ τ_max 는 실측 파단토크(최저 0.528, 평균 0.62 Nm)보다 확실히 낮아야 한다 — 회전 금지.
backlash:
  tau_max_nm: 0.45
  ramp_nm_per_s: 0.12
  cycles: 6                           # 워밍업 2 + 측정 4
  warmup_cycles: 2                    # ★강성이 주기마다 오른다(기계적 안정화) → 초기 주기 폐기
  tau_break_ref_nm: 0.62              # 실측 파단(참조) — 안전여유 판정용
  q_elastic_max_deg: 1.5              # 이 이상 움직이면 회전으로 보고 중단
  # ★위치별로 측정한다. 강성·백래시는 물리는 기어 이빨 쌍에 따라 달라서
  #   한 위치만 재면 다른 축과 비교할 수 없다(실측: 위치에 따라 44~46% 변동,
  #   좌우 두 축의 범위가 거의 완전히 겹친다 → 단일위치 좌우비교는 무의미).
  positions_deg: [-8.0, 0.0, 8.0]

# ── 주파수응답 FRF (act_measure_frf.py) — 공진·감쇠·강성 ────────────────────
#   ⚠ 다리 미장착 상태의 공진은 배포 조건이 아니다. 관성이 10배면 f_n 이 √10 배
#     낮아져(20 → 6.5 Hz) 200Hz 샘플링에 30점/주기가 되어 훨씬 정확하다.
#     **다리 장착 후에 측정할 것.**
frf:
  clamped: false                      # ★true = 출력축 클램프 고정. 파단토크 제약이
                                      #   풀려 진폭을 2~3배 → SNR 개선(가장 효과적)
  amp_nm_free: 0.45                   # 자유 상태(파단 0.62 Nm 이하 유지)
  amp_nm_clamped: 1.5                 # 클램프 고정 시
  f0_hz: 1.0
  f1_hz: 40.0
  duration_s: 12.0
  reps: 20                            # 동기평균 횟수 — 노이즈가 √N 로 준다
  coherence_min: 0.8                  # γ² 이 이 값 미만인 주파수는 신뢰하지 않는다

# ── 관성 측정(2단 토크법) ────────────────────────────────────────────────────
#   ★순환이 없는 유일한 관성 경로다. kp=kd=0 이라 드라이버가 τ 를 되계산할 항이 없고,
#     우리가 넣은 τ_ff 가 곧 입력이다. 마찰·중력은 τ–q̈ 직선의 **절편**으로 빠지므로
#     마찰 모델이 필요 없다 — 기울기가 곧 I.
#   ⚠준위는 전부 **파단토크 이상**이어야 한다. HL_foot 실측 파단 0.674 Nm(채널).
#     미만이면 안 움직여 표본이 안 잡힌다.
# ★관성 실측 — 공통속도법(act_measure_inertia_torque). **채널토크 기준 I_ch·k² = I_joint**
#   ROTOR_I = (I_joint − I_link) / N²,  N = 7×gear_k (드라이버 7:1 가정 × 실감속비 보정)
measured_inertia_joint:
  # ch: I_joint[kg·m²]  — 중력상쇄를 켠 뒤의 값만 넣는다(2026-08-14 이전 값은 무효)
  2: 0.11192   # HL_calf 2026-08-14 · MJCF 예측 0.11258 대비 −0.6% · 방향간 편차 9.4%
               #   R² +0.9969 / −0.9855 · 24점 · 파단 0.697Nm 로 준위 자동설계
#   ⇒ ROTOR_I = (0.11192 − 0.0310)/10.5² = **7.340e-4**
#     foot τ_ff 경로 실측 7.327e-4(2026-08-11)와 **+0.17%** 로 일치한다.
#     감속비(8.4 vs 10.5)도 방법도 다른 두 축이 만났다 ⇒ pace_cmaes `--pin rotor` 근거.
# ⚠JDAMP 는 이 시험으로도 **못 얻었다**. HL_calf 절편~q̇_ref 직선성 R²=0.277 로
#   추세가 안 보인다. 잔차 σ 0.0448Nm 에서 2σ 상한만 나온다: |b_joint| < 0.138.
#   값이 아니라 **상한**이다 — PACE 의 JDAMP 상자 천장을 낮추는 데만 쓸 것.

inertia_torque:
  # ★공통속도법 + **q̈~τ 회귀**(x=τ 정확, y=q̈ 잡음). I = 1/기울기.
  #   ⚠반대로(τ~q̈) 놓으면 errors-in-variables 감쇠로 **−19% 편향**이 난다.
  #     마찰 산포가 0 인 합성에서는 안 드러난다(편향 +0.02%) — 실기의 지배적 오차원이
  #     마찰 산포(파단토크 CV 15.6%)라는 걸 알고서야 보였다.
  auto_levels: true           # ★파단토크에서 준위를 **축별로 역산**한다(상수표 금지)
  n_levels: 6                 # 4→6. 회귀 검증력 + errors-in-variables 완화
  u_lo_frac: 0.30             # 최저 순토크 = 파단×0.30 (Stribeck 구간 회피)
  repeats: 2                  # 마찰 산포가 지배적이라 평균으로 낮춘다(σ ∝ 1/√n)
  tau_levels_nm: [0.90, 1.05, 1.20, 1.35]   # auto_levels 실패 시 폴백(HL_foot 기준)
  tau_max_nm: 2.00            # 자동설계가 1.5 Nm 근처까지 올린다
  travel_max_deg: 70.0        # ★방향별 시작점으로 상자 전체를 쓴다(27°→69°)
  box_margin_deg: 3.0         # 한계상자 끝에서 이만큼 안쪽에서 출발
  travel_deg: 27.0            # _ch_box 가 없을 때의 폴백
  vel_cap_dps: 170.0          # vel_trip 200 아래 여유 30
  vref_dps: 100.0             # ★q̈ 를 읽는 공통속도
  # ★같은 런을 여러 속도에서 다시 읽어 **b(점성)** 까지 뽑는다 (2026-08-14).
  #   절편 = b·q̇_ref + τ_c(q̇_ref) + τ_g 는 q̇_ref 의 일차식이다 ⇒ 기울기가 b(+dτ_c/dq̇).
  #   하드웨어를 다시 안 돌린다 — 런 하나에 이 속도들이 이미 다 들어 있다.
  #   ⚠상한은 vel_cap_dps(170) 아래로. 그 속도에 못 미친 런은 그 점에서 자동 제외된다.
  vref_sweep_dps: [40, 60, 80, 100, 120, 140]
  # ★창이 런의 이 비율을 넘게 덮으면 그 점을 버린다 (2026-08-14).
  #   덮으면 q̈ 가 'q̇_ref 에서의 값' 이 아니라 런 전체 평균이 되어 공통속도법이 깨진다.
  #   실기 HL_calf +방향에서 런 0.101s 에 창 0.092s(**91%**)가 조용히 통과하고 있었다.
  #   런 0.135s 에 창 0.144s(**107%**)인 점도 있었다 — 창이 런보다 길다.
  # ⚠상한을 0.80 으로 잡는 근거: design_levels 의 제약 ①② 를 만족하는 **정상** 설계도
  #   최대 71% 까지 덮는다(t_run ≥ skip+2·half = 0.14s · 창 2·half = 0.10s).
  #   0.60 으로 조이면 자동설계가 낸 정상 준위를 버린다. 0.80 은 71% 를 통과시키고
  #   91% 를 잡는다.
  win_cover_max: 0.80
  win_half_s: 0.05
  skip_s: 0.04
  brake_kp: 30.0
  brake_kd: 2.0

# ── 전축 동시 처프 (PACE 재현매칭 입력) ──────────────────────────────────────
#   ★hip 진폭만 작다. MJCF 로 자기충돌 포락선을 전수(꼭짓점 2^8) 확인한 결과:
#       전축 동일 진폭 ±10° 안전 · **±15° 부터 두 발 충돌**(HL_sphere↔HR_sphere −70mm)
#       **hip 을 ±8° 로 묶으면 나머지는 ±30° 까지 전부 안전**
#     원인은 hip 이다 — 내전하면 발이 모인다.
#   ★f_start/f_end 를 축마다 다르게 준다. 같은 처프를 전 축에 넣으면 궤적이 완전히
#     상관되어 파라미터를 못 가른다(한 축 관성을 키우고 다른 축을 줄여도 같은 궤적).
#     위상은 황금비 수열로 벌린다(재현 가능·균등분포).
pace_multi:
  # ═══════════════════════════════════════════════════════════════════════════
  # ★게인·한계를 **이 시험 전용**으로 따로 둔다. safety/joints 의 배포값을 건드리면
  #   마찰·토크·관성 시험까지 같이 느슨해진다.
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # ── kp: **중력이 허락하는 만큼만** 쓴다 ──────────────────────────────────
  #   ★kp 가 높으면 q 가 q_cmd 에 붙어 **파라미터 정보가 사라진다**(kp→∞ 면 q≡q_cmd).
  #     실측 민감도(ROTOR_I +10% 시 궤적변화): kp 0.2배 0.119° → 1.0배 0.086°.
  #   ★그런데 하한이 있다 — 중력 처짐 = τ_g/kp_joint. 3° 이내로 두려면:
  #         hip 5.25/0.052 = 100 ← **이미 하한**. 못 낮춘다
  #         thigh 2.06 → 40 · calf 0.90 → 17 · foot 0.03 → 1
  #     ⇒ hip·thigh 는 배포값 유지, calf·foot 은 절반으로 낮춰 민감도를 얻는다.
  #   ⚠2026-08-11 한때 "kp 높을수록 민감도가 좋다" 고 적었는데 **틀렸다** —
  #     그 측정은 시뮬이 바닥을 딛고 있어서 나온 인공물이었다(pace_cmaes 주석 참조).
  #   ★하한은 셋이 만든다(모터 기동 아님): ①중력처짐 τ_g/kp ②마찰 데드밴드 τ_c/kp
  #     ③대역 f_n=√(kp·k²/M)/2π ≥ 1.3·f_end. 축마다 지배 요인이 다르다 —
  #     **hip 은 중력(100 이 하한), foot 은 마찰**(21 이 하한).
  #   ⚠한때 foot 을 15 로 잡았는데 하한 21 밑이라 데드밴드가 1.4° 였다 → 22 로 올림.
  #     calf 는 40 이 하한(15) 대비 2.8배라 25 로 낮춰 민감도를 얻는다.
  kp: {0: 100.0, 4: 100.0, 1: 50.0, 5: 50.0, 2: 25.0, 6: 25.0, 3: 22.0, 7: 22.0}
  # ── kd: ζ≈0.7 (kd = 2ζ√(kp_joint·M)/k²). 공진 피크 없이 위상지연 최소 ──
  #   hip 은 kd_max 6.0 에 걸려 ζ 가 0.7 보다 낮다.
  kd: {0: 6.0, 4: 6.0, 1: 4.06, 5: 4.06, 2: 1.56, 6: 1.56, 3: 1.27, 7: 1.27}
  #
  # ── 한계 완화 (이 시험에만) ─────────────────────────────────────────────
  #   ★τ_trip 8 → 16: **중력이 예산을 먼저 먹는다**. hip 중력만 5.25 Nm 이라
  #     8 Nm 에서는 동적 여유가 0.35 Nm 뿐이다. 8 은 다리 없던 시절 값이고
  #     액추에이터 한계는 84 Nm 다 — 16 은 그 19% 다.
  #   ★err_max 12 → 35: 대역 근처에서 흔들면 **위상이 41° 밀린다**(r=0.47).
  #     오차/진폭 = 2sin(φ/2) = 0.69 라 도(°) 절대값 가드는 처프에 부적절하다.
  #     진짜 보호는 토크·속도·위치 한계가 한다.
  # ── ★검증용 게인셋 (PACE arXiv:2509.06342 — "validation at unseen PD gains") ──
  #   원문은 식별 Pτ=60/Dτ=2 → 검증 145/5 (약 2.4배)로 **다른 게인에서 같은 θ 가 나오는지**를
  #   본다. hold-out 궤적보다 강한 검증이다 — 게인이 바뀌면 순환·과적합이 바로 드러난다.
  #   ⚠hip 은 kp_max=100 에 **이미 걸려 있어** 못 올린다. 올릴 수 있는 축만 2배로 간다.
  #     내리는 쪽은 안 된다 — foot 은 마찰 데드밴드 하한이 21 이라 그 밑으로 못 간다.
  #   kd 는 같은 ζ 를 유지하려면 √2 배(kd = 2ζ√(kp·M)).
  kp_validate: {0: 100.0, 4: 100.0, 1: 100.0, 5: 100.0, 2: 50.0, 6: 50.0, 3: 44.0, 7: 44.0}
  kd_validate: {0: 6.0, 4: 6.0, 1: 5.74, 5: 5.74, 2: 2.21, 6: 2.21, 3: 1.80, 7: 1.80}
  tau_trip_nm: 16.0
  err_max_deg: 35.0
  #
  # ── 궤적 ────────────────────────────────────────────────────────────────
  #   진폭은 **관성토크 예산에서 역산**한다: τ_ch = M·A·ω²/k ≤ (0.6·τ_trip − τ_g/k)
  #   f_end 를 낮게 잡는 이유: 위상지연이 r=f/f_n 로 커지고 그게 곧 추종오차다.
  #   ★hip 은 자기충돌 때문에 8° 상한(MJCF 꼭짓점 2^8 전수 확인).
  # ★좌우 대칭 — base net wrench 상쇄 (PACE arXiv:2509.06342 §3.2.2)
  #   우리는 크레인에 매달아 잰다. 반력이 크면 base 가 흔들리는데 시뮬은 base 고정이라
  #   그 흔들림이 통째로 식별오차가 된다. IMU 가 없어 검출도 못 한다.
  #   실측(design_excitation.py 6s, 체중 136N): 수평력 x 3.69N(2.7%) → **1.76N(1.3%)**
  #   식별력은 사실상 불변(조건수 5.4→5.5). 상세는 collect_multichirp.apply_mirror.
  #   ⚠좌우 종속이 되므로 **좌우 분리 식별(--per-axis)과는 양립 불가.** 그때는 null 로 둘 것.
  mirror: neg
  duration_s: 30.0
  ramp_s: 2.0
  #            hip  thigh calf foot | hip  thigh calf foot
  #   ★calf 24→19: q̇ = A·2πf_end 가 속도상한 200dps 를 넘었다(211dps)
  # ★진폭 축소 (2026-08-12) — 속도 여유가 10% 뿐이었다(명령 최대 179dps · 상한 200).
  #   30초를 연속으로 도는 시험이라 한 번만 넘어도 트립이고, **실측은 명령보다 크다**
  #   (추종 지연·오버슛). ⇒ 최대 146dps · 여유 27% 로 낮춘다.
  #   ★주파수가 아니라 **진폭**을 줄인다: 속도 ∝ A·f · 가속도 ∝ A·f² 이므로
  #     f 를 줄이면 가속도가 제곱으로 손해다. ROTOR_I 감도가 가속도 의존이라 치명적이다.
  #   감도는 진폭에 비례해 준다(thigh ×0.82) — 설계도구 분해능 2.2% → 2.7% 수준으로,
  #     판정기준 15% 에 여유가 충분하다.
  # ★★hip 진폭 8 → **5°** · f_end 1.20/1.25 → **1.80/1.85 Hz** (2026-08-12, 실기 관찰).
  #   작업자가 처프 중 "발끝이 부딪힐 것 같다" 고 봤다. MuJoCo 로는 최소 간격이
  #   +69.4mm 로 나오지만 **모델은 발을 반경 36mm 구 2개로만 표현한다** — 실제 발끝은
  #   그보다 넓어 모델값이 낙관적이다. 눈으로 본 쪽이 맞다.
  #   ⇒ 양발 간격은 hip 이 지배한다: **1° 당 17mm**. 8→5° 로 69 → **119mm**.
  #   ⚠진폭만 줄이면 hip 피크속도가 60 → 38dps 로 떨어져 점성(JDAMP) 신호가 죽는다.
  #     주파수로 되찾는다: 1.80Hz 에서 **57dps** 로 거의 원상복구다.
  #     간격은 그대로 119mm — 간격은 **위치 포락선**이 정하므로 주파수와 무관하다.
  #   ⚠위 "진폭이 아니라 주파수를 줄인다" 원칙과 반대로 보이지만 아니다: 여기서는
  #     **기구 간섭이 진폭 상한을 정한다**. 그 안에서 감도를 지키려고 주파수를 올린 것이다.
  #     가속도 ∝ A·f² 이므로 8°/1.2Hz → 5°/1.8Hz 는 가속도가 오히려 **1.4배**다.
  #   ⚠1.80Hz 는 hip 폐루프 대역(ω_n 21.9rad/s = 3.5Hz)의 절반이다. 추종지연이 커지지만
  #     PACE 는 지연 T_d 를 모수로 갖고 시뮬도 같은 PD 를 돌리므로 편향이 아니다.
  amp_deg: [5, 18, 16, 13, 5, 18, 16, 13]
  f_start_hz: [0.15, 0.17, 0.19, 0.21, 0.16, 0.18, 0.20, 0.22]
  f_end_hz:   [1.80, 1.30, 1.40, 1.50, 1.85, 1.35, 1.45, 1.55]
