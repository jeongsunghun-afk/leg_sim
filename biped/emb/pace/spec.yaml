# pace/spec.yaml — 액추에이터 하드웨어 스펙 + 시험 안전한계.
#
# ★★ 사용자가 채워야 할 항목은 전부 `TODO` 로 표시했다. TODO 가 남아 있으면
#    actuator_test.py 가 경고하고, 그 값에 의존하는 환산은 "미확정" 으로 보고한다.
#    (없는 값을 추측해서 그럴듯한 숫자를 내놓지 않는다.)
#
# 출처 표기:
#   [문서]  = 프로젝트 문서에 이미 있는 값(quad/PARAMS.md, docs/sim2real_checklist_17dof.html)
#   [실측]  = 2026-08-05 이 로봇에서 실측
#   TODO    = 데이터시트 확인 필요

meta:
  robot: biped_8dof
  # 현재 실장된 축만 시험 가능. SHM 채널 기준.
  installed_channels: [0, 1, 2, 3, 4, 5, 6, 7]   # [실측 2026-08-07] 8축 전부 배선·통신 확인
                                      #   (종전 [0,4] = 다리 미장착 시절. 조립 후 전축 엔코더 수신 확인)

# ── SHM 백엔드 ───────────────────────────────────────────────────────────────
shm:
  lib: /home/rpetubt/simulation/biped/emb/hal/libbipedshm.so
  n_channel: 10
  # ★200 → 500 (2026-08-10). SHM 은 1kHz 로 갱신되는데 200Hz 로 폴링해 **80% 를 버리고**
  #   있었다. q̈ 를 수치미분으로 뽑으므로 직격이다.
  #   ⚠체크리스트의 "≥1kHz" 를 그대로 따르지는 않는다 — 요구 샘플레이트는 **가진 대역폭**에
  #     비례한다. 그 문서는 0.1~20Hz 를 전제하지만, 우리는 홀드 공진(2.5~4.5Hz)과 관성
  #     (다리 장착 후 6.9배) 때문에 f_end 4Hz 가 상한이다. 500Hz 면 4Hz 한 주기당 125샘플로
  #     충분하다. ★그런데 **1000 으로 더 올렸다**(2026-08-10): Python 루프 순수 오버헤드가
  #     실측 101µs 라 1kHz 예산(1000µs)에 SHM ctypes 2회를 넣어도 여유가 크고,
  #     Emb 가 1kHz 이므로 **1:1 로 맞으면 에일리어싱이 사라진다**.
  #     τ_ff 가진에서는 입력을 우리가 만들어 ZOH 문제가 줄지만, q̈ 를 수치미분으로
  #     뽑는 것은 그대로라 샘플이 많을수록 좋다.
  rate_hz: 1000
  recv_wait_ms: 3000

# ── 단위·좌표계 규약 ─────────────────────────────────────────────────────────
units:
  # SHM MotorParam16 의 fPosition/fVelocity 단위. [문서][실측 정합]
  position: deg
  velocity: deg_per_s
  # ★★ 가장 중요한 미확정 항목:
  #   fTorque / fGainKp 가 "모터축(감속기 이전)" 기준인지 "관절축(감속기 이후)" 기준인지.
  #   - 실측된 MIT 법칙: tau = Kp·err[rad] + Kd·derr[rad/s]  (2026-08-05, 오차 2% 이내)
  #   - Kp=10, 오차 4.743deg 에서 tau=0.757 Nm 관측.
  #   이 tau 가 어느 축 기준인지에 따라 관절토크가 N배(감속비) 달라진다.
  #   확정 전까지 리포트는 "보고단위" 와 "×N 관절환산" 을 함께 출력한다.
  torque_frame: joint                 # ★2026-08-05 확정 — 육안 검증:
                                      #   보고 ±17.2° 왕복(36°) 명령 시 출력축이 실제로 36° 회전.
                                      #   모터축 기준이었다면 36/7=5.1° 만 돌았어야 한다.
                                      #   ⇒ 위치·속도·토크·게인 전부 감속기 출력단(관절축) 기준.
  torque_unit: Nm                     # 드라이버가 mNm 로 보고하면 Nm 로 바꾸고 scale 조정
  torque_scale: 1.0                   # 보고값 × 이 값 = Nm

# ── 축별 스펙 ────────────────────────────────────────────────────────────────
#   gear        : 감속비 N                           [문서] PARAMS.md:91 / checklist
#   tau_peak_nm : 관절축 peak 토크                    [문서] 84/84/126/100.8
#   w_noload    : 무부하 각속도[rad/s] = 207/N        [문서] 29.6/19.7 · foot 24.6
#                 ★foot 은 문서의 14.8(=207/14, 재기어 이전값)이 stale → 207/8.4=24.6
#   kt_nm_per_a : 토크상수                            TODO (전류→토크 교차검증용)
#   I_link      : MJCF 링크 관성[kg·m²](관절축 기준)   TODO (ROTOR_I 분리에 필요, 아래 주석 참조)
#   q_min/max   : ★시험 중 절대 넘지 않는 각도한계[deg]
#
#   ⚠ hip 가동범위: docs/sim2real_checklist_17dof.html(2026-07-21)가 **±20°로 확정**
#     ("구 ±0.6109/±35° 폐기")했는데 emb/config/biped_emb.yaml 은 아직 ±35 다.
#     시험은 보수적으로 ±20°를 따르고, 그 안에서도 test_range 로 더 좁힌다.
joints:
  # ★★I_link — 2026-08-06 **다리 조립 완료**로 전면 갱신. 종전 0.0 은 폐기.
  #   종전 주석: "다리 미장착이라 출력축에 링크가 없다 → I_link=0". 그 전제가 끝났다.
  #   0 을 그대로 두고 돌리면 **다리 관성이 통째로 로터관성으로 둔갑**한다.
  #   출처: `extract_ilink.py` (MJCF biped_flatfoot.mjcf, **홈자세 q=0**).
  #         mj_fullM 대각성분 ↔ 복합강체 직접합산 두 경로가 1e-16 이내 일치(교차검증됨).
  #
  #   ⚠자세 의존값이다. hip 은 무릎을 −40° 접으면 0.1589 → 0.1822 (+15%) 로 변한다.
  #     **시험 자세를 홈(q=0)으로 고정**하고 재라. 다른 자세로 재면 이 값을 다시 뽑을 것.
  #
  #   ⚠⚠hip/thigh 에서 ROTOR_I 를 빼내지 말 것 — I_link 가 신호의 81%/77% 를 차지한다
  #     (ROTOR_I = (I_total − I_link)/N² 에서 남는 게 19%/23% 뿐).
  #     I_link 5% 오차 → ROTOR_I 22% 오차로 증폭된다. **다리 없이 잰 7.4e-4 가 더 정확하다.**
  #     다리 장착 상태에서 ROTOR_I 를 교차검증하고 싶으면 **foot(링크비중 3.7%)·calf(26%)**
  #     로 재라 — 거기선 로터 반사관성이 지배적이라 분리가 잘 된다.
  #
  #   kt_nm_per_a — §10 데이터시트(RO100 kt=0.2 Nm/A) × N × η(0.9 가정). 전축 동일 모터
  #     (tau_peak÷gear 가 8축 모두 12.0 Nm = 데이터시트 피크토크와 일치).
  #     ⚠η=0.9 는 가정이다. hip 은 피크토크 교차검증에서 η≈0.97 이 나왔다(§10) → 실측하면
  #       1.26 이 아니라 1.36 쪽일 수 있다. 정밀히 쓰려면 전류 실측으로 kt/η 를 분리할 것.
  - {ch: 0, name: HL_hip,   gear: 7.0,  tau_peak_nm: 84.0,  w_noload: 29.6,
     kt_nm_per_a: 1.26, I_link: 1.724200e-01, q_min: -6.0, q_max: 6.0, gear_k: 1.0, I_total_pred: 0.20868}
  - {ch: 4, name: HR_hip,   gear: 7.0,  tau_peak_nm: 84.0,  w_noload: 29.6,
     kt_nm_per_a: 1.26, I_link: 1.731300e-01, q_min: -6.0, q_max: 6.0, gear_k: 1.0, I_total_pred: 0.20939}
  # ── 기구는 조립됐으나 배선/통신 미확인 → installed_channels 에 아직 없음 ──
  #   ⚠아래 6축은 sign·offset·게인이 전부 **미검증 외삽값**이다(config/biped_emb.yaml 참조).
  #     q_min/q_max 도 실측이 아니라 보수적 추정이다. 시험 전 JOG 로 각축 검증부터 할 것.
  - {ch: 1, name: HL_thigh, gear: 7.0,  tau_peak_nm: 84.0,  w_noload: 29.6,
     kt_nm_per_a: 1.26, I_link: 1.322900e-01, q_min: -60, q_max: 40, gear_k: 1.0, I_total_pred: 0.16855}
  - {ch: 2, name: HL_calf,  gear: 10.5, tau_peak_nm: 126.0, w_noload: 19.7,
     kt_nm_per_a: 1.89, I_link: 3.100000e-02, q_min: -40, q_max: 40, gear_k: 1.5, I_total_pred: 0.11258}
  - {ch: 3, name: HL_foot,  gear: 8.4,  tau_peak_nm: 100.8, w_noload: 24.6,
     kt_nm_per_a: 1.512, I_link: 2.124700e-03, q_min: -40, q_max: 23.2, gear_k: 1.2, I_total_pred: 0.054339}
  - {ch: 5, name: HR_thigh, gear: 7.0,  tau_peak_nm: 84.0,  w_noload: 29.6,
     kt_nm_per_a: 1.26, I_link: 1.322900e-01, q_min: -60, q_max: 40, gear_k: 1.0, I_total_pred: 0.16855}
  - {ch: 6, name: HR_calf,  gear: 10.5, tau_peak_nm: 126.0, w_noload: 19.7,
     kt_nm_per_a: 1.89, I_link: 3.100000e-02, q_min: -40, q_max: 40, gear_k: 1.5, I_total_pred: 0.11258}
  - {ch: 7, name: HR_foot,  gear: 8.4,  tau_peak_nm: 100.8, w_noload: 24.6,
     kt_nm_per_a: 1.512, I_link: 2.124700e-03, q_min: -40, q_max: 23.2, gear_k: 1.2, I_total_pred: 0.054339}

# ── 시험 게인 (2026-08-05 실측 확정) ─────────────────────────────────────────
#   tau = Kp·err[rad] + Kd·derr[rad/s]  → Kp 1 당 0.0175 Nm/deg.
#   Kp=40/Kd=2 에서 ±5° 사인 추종지연 1.4°, 채터 없음.
gains:
  # ⚠**kp 40 은 다리 미장착 '단축 구성' 시절의 가설정값**이다(step/토크 가진으로 선정한
  #   값이 아니다). 링크가 붙어 관성이 6.9배가 된 지금은 가진이 제대로 안 된다:
  #     명령 대비 달성진폭 @4Hz — kp40: hip 0.31 · thigh 0.40 (배포게인: 0.62 · 0.40)
  #   게다가 kp40/kd2 는 ζ=0.32 로 저감쇠라 2Hz 부근에서 1.59배로 튄다.
  #   ⇒ 위치처프를 쓸 거면 **배포 게인**(hip100/thigh50/calf50/foot30, kd 6/4/3.5/2)을 쓸 것.
  # ★★그러나 근본은 다르다 — **위치처프 자체가 순환**이다.
  #   τ_rep = kp·err + kd·derr 로 R² 0.97 재구성된다(지연 10ms 정렬 시).
  #   kp 를 무엇으로 잡든 마찬가지다. ⇒ **τ_ff 가진**(kp=kd=0)으로 가야 순환이 소멸한다.
  #   그때는 이 kp 값 자체가 무의미해진다(홀드축에만 쓰인다).
  kd: 2.0
  # ★60 → 100 (2026-08-10). 60 은 **다리 미장착** 시절에 정한 보수적 상한인데,
  #   배포 제어기는 이미 hip 에 kp 100 을 실기에서 쓰고 있다(config/biped_emb.yaml).
  #   시험 하니스만 운용값보다 낮게 잠겨 있어 홀드 강성을 못 올리고 있었다.
  #   ⇒ 상한을 **실기에서 검증된 최대값**으로 맞춘다. 새 위험을 만드는 게 아니다.
  kp_max: 100.0                        # 이 값 초과 금지(감사 권고)
  # ★6.0 으로 상향(2026-08-11). 종전 3.0 은 **배포 홀드게인 kd 를 조용히 잘랐다** —
  #   ch0/4 는 6.0 을 넣어도 3.0 만 인가돼 홀드 감쇠가 절반이었다(8축 중 6축이 잘림).
  #   kp_max 는 60→100 으로 이미 올렸는데(2026-08-10) kd_max 가 같이 안 올라갔다.
  kd_max: 6.0
  enable_ramp_s: 0.3                  # 인가 시 게인 0→목표 램프(스텝 토크 방지)

# ── 안전 (전 시험 공통, hwio.py 가 강제) ────────────────────────────────────
safety:
  tau_trip_nm: 8.0                    # |측정토크| 이 값 초과가 tau_trip_ms 지속 → limp+중단
  tau_trip_ms: 50
  vel_trip_dps: 200.0                 # 처프 최고속도 151 deg/s 수용(무부하 29.6rad/s=1696deg/s 의 12%)
  err_max_deg: 12.0                   # |명령−측정| 초과 → limp+중단 (kp40 → 8.4Nm)
  stale_ms: 150                       # 상태값 무변화 지속 → limp+중단 (EtherCAT OP 이탈 감지)
  settle_s: 0.5                       # 구간 전환 후 정착 대기

  # ── 시험축 외 홀드 (2026-08-06, 다리 조립 후 추가) ─────────────────────────
  #   ★다리 미장착 시절엔 시험축 외 전 채널이 limp 였고 그게 옳았다(잡을 게 없었다).
  #     다리를 단 뒤로는 두 가지 이유로 깨진다:
  #       (a) PACE 가 쓰는 I_link 는 질량행렬 대각성분 M[i][i] 이고 그 정의가
  #           **"다른 DOF 가속도 0"** 이다. 무릎이 limp 면 다리가 접혀 강체 가정이 깨지고
  #           측정된 I_total 은 I_link + ROTOR_I·N² 과 아예 다른 값이 된다.
  #       (b) 하위 관절이 무여자면 중력으로 접힌다(안전).
  #   ⇒ true 면 installed_channels 중 시험축을 뺀 나머지를 측정위치에 잡아둔다.
  #   ⚠홀드가 밀리면(|명령−측정| > err_max) hwio.check_hold 가 limp + 중단시킨다.
  #     조용히 밀린 채로 계속 재면 그 데이터는 통째로 쓰레기다.
  #   ⚠⚠**실기 미검증**(2026-08-06 현재 Emb 미기동). 첫 실행은 반드시 사람이 보는 앞에서,
  #     로봇을 거치한 상태로 할 것.
  # ★채널별 τ_trip [Nm] (2026-08-12, hip 지그 해제 계기).
  #   위 tau_trip_nm 8.0 은 **foot 크기**다. 그걸 전 채널에 적용하면 hip 이 위험하다:
  #     hip 은 다리를 좌우로 여는 방향이라 **자세와 무관하게 상시 5.25 Nm**(MJCF 중력)
  #     → 문턱의 **66%** 를 가만히 있어도 점유한다. 여유 2.75 Nm.
  #   지그가 물려 있던 동안은 지그가 그 반력을 받아 hip 오차가 0.0° 였고 드러나지 않았다.
  #   ⇒ hip 만 12.0 으로 올린다. 정적 5.25 대비 2.3배, MJCF actuatorfrcrange 84 의 14% —
  #     여전히 매우 보수적이다. 나머지 채널은 8.0 그대로.
  #   ⚠이건 "안전을 푼" 게 아니라 **문턱을 축에 맞춘** 것이다. 종전엔 hip 에 대해
  #     문턱이 너무 빡빡해서 정상 동작이 트립할 수 있었다.
  #   ★12.0 → 10.0 으로 되내린다 (2026-08-12 저녁, 사용자 "hip 은 좀 조심해야해").
  #     12.0 은 **드라이버가 실제로 죽은 10.6 Nm 보다 높다** — 문턱으로서 무의미했다.
  #     정당한 최대치를 다시 세어 보면 10.0 이 충분히 넉넉하다:
  #       토크모드  bias 5.25 + swing 2.5           = 7.75
  #       파단푸시  중력 4.85 + tau_cap 2.5         = 7.35
  #     둘 다 2.2Nm 이상 여유가 남는다. 진짜 보호는 아래 두 겹이 한다 —
  #     hwio 의 시험축 스톨 감지(중력+2Nm·300ms)와 breakaway 의 tau_cap_nm.
  tau_trip_by_ch: {0: 10.0, 4: 10.0}

  hold_others: true
  # ★축별 홀드게인 (2026-08-10). 값은 **배포 제어기와 동일** = 실기 검증값.
  #   홀드축은 스프링이라 공진 f_n = √(kp·gear_k²/I) 위에서 '자유' 처럼 행동한다.
  #   그 대역이 처프 안에 들어오면 식별값이 오염된다. 축마다 I·gear_k 가 달라
  #   스칼라 하나(종전 40)로는 못 맞춘다.
  #     ch 0,4=hip · 1,5=thigh · 2,6=calf · 3,7=foot
  #   결과 f_n: hip 3.19 · thigh 2.53 · calf 5.08 · foot 4.49 Hz
  #   ⇒ **thigh 2.53Hz 가 최저** — calf·thigh 측정은 f_end 를 그 아래로 낮출 것.
  hold_kp: {0: 100.0, 4: 100.0, 1: 50.0, 5: 50.0, 2: 80.0, 6: 80.0, 3: 30.0, 7: 30.0}  # ★calf 좌우 80 — 2026-08-11 (50→80, 공진 5.03→6.36Hz)
  hold_kd: {0: 6.0, 4: 6.0, 1: 4.0, 5: 4.0, 2: 3.5, 6: 3.5, 3: 2.0, 7: 2.0}

# ── 시험 파라미터 ────────────────────────────────────────────────────────────
friction:
  # ★축별 축소 (2026-08-12) — **hip 은 크게 움직이면 두 다리가 부딪힌다**(사용자 확인).
  #   hip 은 롤축이라 안쪽으로 처지고, 좌우 간격이 좁아 처짐(−3.5°)에 스윕(±8°)이 더해지면
  #   한쪽 끝이 −11.5° 까지 간다. 거기서 다리끼리 닿아 모터가 스톨하고,
  #   전류 급증 → 드라이버 보호 → EtherCAT OP 이탈(오늘 hip 시험 중 3회 동결)로 이어진다.
  #   ⚠MuJoCo 로는 이 충돌을 못 본다 — 충돌 판정 geom 이 **발 구 4개뿐**이고
  #     thigh·calf 링크·케이블·브래킷·몸통은 전부 빠져 있다(15개 중 4개만 활성).
  #     "접촉 0" 은 안 부딪힌다는 증거가 아니다. 눈으로 본 것이 우선이다.
  #   ⇒ hip 은 스트로크를 절반으로 줄인다. 시험상자도 ±12.9 → ±9.0 으로 좁혔다.
  #   ★2차 축소 (2026-08-12) — 8° 도 부족했다. **처짐 때문에 축이 명령보다 2~3.5° 바깥에
  #     선다**(kp100 으로 5.25Nm 을 물어야 하므로). 상자 +9.0 에서 명령이 잘렸는데
  #     실측은 11.14° 까지 갔다 — 지그 접촉(11.5)과 0.4° 차이다.
  #     그리고 명령이 상자에서 잘리니 breakaway 가 "4°를 밀어도 미동" 으로 뜬다.
  #     막힌 게 아니라 **명령이 안 나간 것**이다(HR 은 양방향 다 그랬다).
  #   ⇒ 상자 ±9.0 → ±6.0, 스트로크도 절반으로. 명령 +6 → 실측 ~+8, 지그까지 3.5° 여유.
  #   ★3차 — **더 세게 흔든다** (2026-08-12, 사용자 승인 "정확도가 올라간다면 대차게").
  #     문제: 최대 35dps(0.61rad/s)에서 점성 몫이 마찰의 **8%** 뿐이라 기울기가 잡음에
  #     묻힌다. HL_calf 실측이 그랬다 — 2→35dps 에서 0.642→0.622 로 **음의 기울기**가
  #     나와(Stribeck) JDAMP 적합이 nan 이 됐다.
  #     ⇒ 스트로크를 키워 고속을 넣는다. 점성 몫 **8% → 23%** 로 잡음 위로 올린다.
  #     ⚠속도를 올리려면 스트로크가 커야 한다: 통과시간 stroke/v 가
  #       (2·accel_skip 0.30 + 최소정착 0.03) = 0.33s 를 넘어야 정착 데이터가 남는다.
  #       안 맞는 속도는 **자동으로 빠진다**(act_measure_friction 의 _use/_drop) — 손으로
  #       관리하지 않는다. 뺀 속도는 로그에 찍힌다.
  #     ⚠hip 은 못 올린다 — 상자가 ±6° 라 47dps 가 한계이고 점성 몫이 11% 다.
  #       hip 의 JDAMP 는 이 방법으로 얻을 수 없다.
  #     ⚠--solo 에서 시험축이 40° 폭으로 왕복한다(종전 16° 의 2.5배).
  #       **손으로 잡은 다리와 부딪히지 않는지 눈으로 확인할 것.**
  # ★같은 값을 **폭·빠르기**로 읽으면 (2026-08-12, 사용자 요청 — dps 는 감이 안 온다):
  #     thigh       ±20°  를  0.025 · 0.063 · 0.125 · 0.25 · 0.5 · 0.75 Hz
  #     calf        ±28°  를  0.018 · 0.045 · 0.089 · 0.18 · 0.36 · 0.71 · 1.07 Hz
  #     foot        ±12°  를  0.042 · 0.104  · 0.208 · 0.417 · 0.833 · 1.25 Hz
  #     hip         ±2.5° 를  0.2 · 0.5 · 1 Hz
  #   ⚠**저장은 dps 로만 한다.** 마찰 회귀의 회귀변수가 속도라(f = τ_c + b·v),
  #     Hz 로 적으면 stroke 를 건드릴 때 실제 속도가 조용히 따라 변한다.
  #     변환은 act_measure_friction.swing_str() **한 곳뿐**이고 로그·리포트가 그걸 쓴다.
  #     위 주석 숫자도 파생값이다 — 아래 dps 를 고치면 여기도 같이 고칠 것.
  by_ch:
    # ★hip 은 **키우지 않는다** — 오히려 파단푸시를 2.5→1.5° 로 줄였다.
    #   상자가 ±6° 라 어차피 47dps 가 한계고 점성 몫이 11% 뿐이라 얻을 게 없는데,
    #   hip 은 오늘 드라이버를 잃고 EtherCAT 이 2회 얼어붙은 축이다. 손해만 크다.
    #   1.5°×kp 100 = 2.6Nm 로 밀며, 실측 마찰 0.80~0.88Nm 의 3배라 파단에는 충분하다.
    0: {breakaway: {max_push_deg: 1.5}, sweep: {stroke_deg: 5.0, speeds_dps: [2, 5, 10]},
        sine: {amplitude_deg: 2.5}}
    4: {breakaway: {max_push_deg: 1.5}, sweep: {stroke_deg: 5.0, speeds_dps: [2, 5, 10]},
        sine: {amplitude_deg: 2.5}}
    # ★thigh 만 30° 로 낮춘다 (2026-08-12, 사용자 결정 — 스톨 2회를 겪고).
    #   상자 [-60, +40] 인데 **정지자세가 +35~40** 이라 위쪽 여유가 사실상 없다.
    #   40° 로는 중심을 어디에 두든 스윕 끝이 +40 스톱에 붙는다(실기에서 그렇게 스톨).
    #   ⇒ 30°. 점성 몫 23% → 17% 로 줄지만 스톨보다 낫고, thigh 동특성은 어차피
    #     PACE 다축처프가 amp 18° 로 다시 훑는다(spec.pace_multi.amp_deg).
    #   ⚠calf 는 상자가 ±60 이라 40° 그대로 여유롭다 — 같이 줄이지 말 것.
    # ★★스트로크는 이제 **최고속도가 등속이 되도록** 역산해서 정한다 (2026-08-12).
    #   등속 가능 최고속 = stroke / (2·3τ + 최소정착),  τ = 1/(ζ·ω_n) [폐루프]
    #   그 선을 넘긴 점이 실제로 튀었다 — thigh 80dps(1.43배) **+304%**.
    #   ⇒ 원하는 최고속에서 거꾸로 스트로크를 잡는다:
    #       thigh  30 → **40°**  (v_max 56 → 75, 최고속 60dps 를 담는다)
    #       calf   40 → **56°**  (v_max 96 → 135, 120dps 를 되살린다)
    #     calf 120dps 는 JDAMP 0.0621 의 **유일한 상승 근거**였는데 한계를 1.25배
    #     넘긴 점이었다 — 스트로크를 키워 그 점을 **정당하게** 다시 얻는다.
    #   ⚠thigh 는 80 → 60dps 로 낮췄다. 80 을 담으려면 스트로크 44° 가 필요한데
    #     늘어진 다리가 아래쪽에서 간섭한 전례가 있어 거기까진 안 간다.
    #     thigh JDAMP 가 끝내 안 나오면 PACE 처프로 넘긴다(그쪽이 본래 도구다).
    #   ⚠hip 은 상자가 ±6° 라 스트로크 5° 가 상한이고 v_max 11dps 다 — 손댈 수 없다.
    1: {sweep: {stroke_deg: 40.0, speeds_dps: [2, 5, 10, 20, 40, 60]}}
    5: {sweep: {stroke_deg: 40.0, speeds_dps: [2, 5, 10, 20, 40, 60]}}
    2: {sweep: {stroke_deg: 56.0, speeds_dps: [2, 5, 10, 20, 40, 80, 120]}}
    6: {sweep: {stroke_deg: 56.0, speeds_dps: [2, 5, 10, 20, 40, 80, 120]}}
    3: {sweep: {stroke_deg: 24.0, speeds_dps: [2, 5, 10, 20, 40, 60]}}
    7: {sweep: {stroke_deg: 24.0, speeds_dps: [2, 5, 10, 20, 40, 60]}}
  # (A) 정지마찰(breakaway): 목표각을 아주 천천히 밀어 토크를 키우다 움직이는 순간 포착
  breakaway:
    ramp_dps: 0.6                     # 목표각 램프 속도[deg/s] — 느릴수록 동적성분↓
    move_thresh_deg: 0.25             # ★위치 변위 기준(속도 노이즈 ±15deg/s 라 속도로는 판정 불가)
    max_push_deg: 8.0                 # 이만큼 밀어도 안 움직이면 포기(막힘/한계 의심)
    trials: 3                         # 방향당 반복(산포 확인)
    # ★푸시 **토크 상한**[Nm] — 중력 대비 초과분 기준 (2026-08-12).
    #   변위 상한(max_push_deg)만으로는 토크가 안 잡힌다. 실제 상한은 max_push×kp 인데
    #   hip 은 2.5°×100Nm/rad = 4.36Nm 이라 중력 4.85 를 더해 **피크 9.2Nm** 이고,
    #   막히면 그걸 4.2초(=2.5/0.6dps) 동안 문다. 2026-08-12 에 10.6Nm 로 밀다
    #   드라이버 파워단을 잃은 게 정확히 이 경로다.
    #   ⇒ 초과분이 이 값을 넘으면 그 시행만 버린다. 실측 마찰 최대 0.88Nm(hip) 의
    #     2.8배라 정상 파단은 절대 못 건드린다.
    tau_cap_nm: 2.5
  # (B) 동적마찰: 등속 구간 여러 속도 × 양방향 → 중력·바이어스 상쇄
  sweep:
    speeds_dps: [2, 5, 10, 20, 35]    # 70 제외 — ±20° 범위에선 등속 구간이 너무 짧다
                                      # (전역 기본. 실제로는 위 by_ch 가 축마다 덮어쓴다)
    stroke_deg: 16.0                  # 등속 구간 길이(중심 대칭). q_min/max 안이어야 함
    dwell_frac: 0.6                   # 구간 중앙 이 비율만 평균(가감속 구간 제외)
    accel_skip_s: 0.15                # 기동 과도 배제(가속토크가 마찰로 섞이는 것 방지)
    min_dwell_samples: 15             # 정상구간 최소 샘플수(미달 시 그 속도 제외)
  # ★★**실측 쿨롱마찰** — PACE 가 이걸 읽어 JFRIC 을 못박는다 (2026-08-12).
  #   pace_cmaes.py 가 스스로 적어 둔 결론이 근거다:
  #     "남은 약한 방향은 JDAMP·JFRIC (−66~+64%). JDAMP.foot↔JFRIC.foot r=+0.93.
  #      궤적으로는 못 고친다. ⇒ 한쪽을 축별 마찰-속도 곡선으로 못박는 게 정공법"
  #   지연(T_d)을 실측해 묶었더니 ROTOR_I 오차가 4.5배 좋아진 전례와 같은 처방이다.
  #
  #   ⚠값은 **채널토크**(감속기 전)다. MJCF dof_frictionloss 는 관절토크이므로
  #     쓰는 쪽에서 **× gear_k** 해야 한다(hip·thigh 1.0 · calf 1.5 · foot 1.2).
  #   ⚠적합 절편(리포트의 JFRIC)이 아니라 **저속 평탄부(≤20dps) 평균**이다.
  #     고속 오염점이 섞이면 절편이 밀린다 — HL_thigh 는 절편 1.02 vs 평탄부 0.66.
  #     dof_frictionloss 는 운동 중 쿨롱마찰이라 평탄부가 맞다.
  #   ★평탄부를 쓰면 좌우가 **네 축 모두 7% 안**에서 맞는다(절편으로는 0.05~16% 들쭉).
  #     hip 6.6 · thigh 2.3 · calf 5.3 · foot 1.8 %
  #   ⚠hip 만 좌우 **기구가 다르다**(HR 샤프트 경유 · HL 직결) — 좌우를 묶어 쓸 때
  #     그걸 감안할 것. 나머지 세 축은 구조가 같다.
  measured_coulomb_ch:            # [Nm] 채널토크. 2026-08-12 --solo 8축 동일방법
    0: 0.854   # HL_hip     (2·5dps 평균)
    4: 0.800   # HR_hip
    1: 0.662   # HL_thigh   (2·5·10·20dps 평균)
    5: 0.678   # HR_thigh
    2: 0.649   # HL_calf
    6: 0.685   # HR_calf
    3: 0.615   # HL_foot
    7: 0.626   # HR_foot
  measured_tau_static_ch:         # [Nm] 파단토크(6시행 평균). 참고·검증용
    0: 1.129
    4: 1.176
    1: 0.953
    5: 0.907
    2: 0.851
    6: 0.888
    3: 0.685
    7: 0.762
  # (C) 저속 사인 — 레퍼런스(act_measure_friction.py)와 동일 개념. 마찰 루프 플롯용
  sine:
    amplitude_deg: 8.0
    frequency_hz: 0.05                # 레퍼런스 0.025Hz. 20s 주기
    cycles: 1.0

pace:
  # 처프 가진(PACE 식별용). 위치명령 처프 → q,dq,tau 로그 → 회귀
  chirp:
    amplitude_deg: 6.0
    f_start_hz: 0.2
    f_end_hz: 4.0                     # 너무 높이면 추종 실패·공진. 기어 백래시 구간 주의
    duration_s: 30.0
  # 가속도는 측정속도의 수치미분 → Savitzky-Golay 평활 (실측 속도노이즈 ±15 deg/s)
  filter:
    savgol_window: 31                 # 홀수, 샘플수
    savgol_poly: 3
  tanh_eps_rad_s: 0.02              # 쿨롱마찰 부호전환 속도폭. ★고정(자유변수로 두면 JDAMP 와 상관)

# ── 지연·로스트모션 (act_measure_latency.py) ────────────────────────────────
latency:
  step_deg: 1.5                       # 스텝 크기. kp40 → 약 1.05 Nm (작고 안전)
  trials: 4                           # 양방향 교대
  window_s: 0.30                      # 스텝 후 타이트 폴링 구간
  gd_amp_deg: 4.0                     # 군지연용 처프
  gd_f0: 0.3
  gd_f1: 3.0
  gd_duration_s: 12.0
  lm_amp_deg: 6.0                     # 로스트모션용 저속 왕복
  lm_freq_hz: 0.08

# ── 순수 토크모드 프로브 (act_probe_torque_mode.py) ─────────────────────────
#   ⚠ 위치+게인 모드와 달리 토크가 자기제한되지 않는다. 마찰(정지 0.71 Nm)을 넘으면
#     관절이 계속 가속하므로 상한을 정지마찰의 2배 이내로 둔다.
torque_mode:
  # ★중력토크 표 — **tools/gen_grav_table.py 가 생성**. 손으로 고치지 말 것.
  #   채널각[deg] → 채널토크[Nm]. 프로브가 그때그때 위치를 읽어 보간해 bias 로 쓴다.
  #   자세는 hold_pose.neutral_deg 고정, 해당 축만 쓸었다. 자세를 바꾸면 재생성할 것.
  #   유래·필요성은 tools/gen_grav_table.py 의 독스트링 참조.
  tau_grav_table:
    0:
      q_ch: [-14.453, -13.008, -11.562, -10.117, -8.672, -7.227, -5.781, -4.336, -2.891, -1.445, 0.0, 1.445,
        2.891, 4.336, 5.781, 7.226, 8.672, 10.117, 11.562, 13.008, 14.453]
      tau: [-6.4729, -6.3676, -6.2583, -6.1449, -6.0277, -5.9067, -5.7819, -5.6534, -5.5213, -5.3857, -5.2466,
        -5.1043, -4.9587, -4.8099, -4.658, -4.5033, -4.3456, -4.1852, -4.0221, -3.8564, -3.6883]
    1:
      q_ch: [-62.759, -53.064, -43.369, -33.674, -23.978, -14.283, -4.588, 5.107, 14.802, 24.497, 34.192,
        43.888, 53.583, 63.278, 72.973, 82.668, 92.363, 102.059, 111.754, 121.449, 131.144]
      tau: [-5.5515, -5.3815, -5.0578, -4.5896, -3.9904, -3.2771, -2.4702, -1.5928, -0.6699, 0.2722, 1.2065,
        2.1063, 2.9459, 3.7014, 4.3512, 4.8767, 5.2629, 5.4988, 5.5775, 5.497, 5.2595]
    2:
      q_ch: [-72.459, -63.889, -55.319, -46.749, -38.179, -29.609, -21.039, -12.469, -3.899, 4.671, 13.24,
        21.81, 30.38, 38.95, 47.52, 56.09, 64.66, 73.23, 81.8, 90.37, 98.94]
      tau: [-0.7477, -0.7842, -0.8131, -0.8342, -0.8473, -0.8522, -0.8489, -0.8374, -0.8178, -0.7904, -0.7553,
        -0.713, -0.6639, -0.6085, -0.5472, -0.4808, -0.4098, -0.3351, -0.2572, -0.1771, -0.0954]
    3:
