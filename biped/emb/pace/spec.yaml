        -0.0277, -0.0143, -0.0007, 0.0128, 0.0263, 0.0396, 0.0525, 0.0651, 0.0772, 0.0887]
  tau_bias_by_ch: {0: -5.247, 1: 0.0, 2: -0.806, 3: -0.032,
                   4: 5.252, 5: -0.059, 6: 0.806, 7: 0.032}
  # ★축별 swing [Nm] — 바이어스 **주변** 진폭. 없으면 tau_max_nm(1.4).
  #   2026-08-12 HL_hip 실측: −dir 은 0.328 에서 파단했는데 +dir 은 1.4 까지 올려도 미동.
  #   즉 정지 밴드 [τ_req−f, τ_req+f] 의 **아래 경계만 잡고 위 경계를 못 잡았다**.
  #   밴드폭이 최소 1.72 Nm(=0.328+1.4) 이므로 마찰 f ≥ 0.86 — 다리 미장착 시절 값
  #   0.65 보다 크다(다리를 달아 베어링 하중이 늘었다면 그럴 수 있다).
  #   ⇒ hip 은 swing 을 2.5 로 키워 양쪽 경계를 모두 잡는다. 그래야 f=(τ⁺−τ⁻)/2 가 나온다.
  #   ⚠피크 |bias|+swing = 7.75 Nm < τ_trip 12.0 (ch0/4). 파단 즉시 토크 0 이라 폭주 안 한다.
  swing_by_ch: {0: 2.5, 4: 2.5}
  tau_max_nm: 1.4                     # 정지마찰 0.71 Nm 의 약 2배
  ramp_nm_per_s: 0.25                 # 느릴수록 파단 판정이 정확
  move_thresh_deg: 0.30               # 위치 변위 기준(속도 노이즈 ±15deg/s 라 속도로는 불가)
  trials: 2                           # 방향당

# ── 백래시·컴플라이언스 (act_measure_backlash.py) ───────────────────────────
#   순수 토크모드가 동작함이 확인돼(2026-08-05) 표준 토션 히스테리시스 시험이 성립한다.
#   ⚠ τ_max 는 실측 파단토크(최저 0.528, 평균 0.62 Nm)보다 확실히 낮아야 한다 — 회전 금지.
backlash:
  tau_max_nm: 0.45
  ramp_nm_per_s: 0.12
  cycles: 6                           # 워밍업 2 + 측정 4
  warmup_cycles: 2                    # ★강성이 주기마다 오른다(기계적 안정화) → 초기 주기 폐기
  tau_break_ref_nm: 0.62              # 실측 파단(참조) — 안전여유 판정용
  q_elastic_max_deg: 1.5              # 이 이상 움직이면 회전으로 보고 중단
  # ★위치별로 측정한다. 강성·백래시는 물리는 기어 이빨 쌍에 따라 달라서
  #   한 위치만 재면 다른 축과 비교할 수 없다(실측: 위치에 따라 44~46% 변동,
  #   좌우 두 축의 범위가 거의 완전히 겹친다 → 단일위치 좌우비교는 무의미).
  positions_deg: [-8.0, 0.0, 8.0]

# ── 주파수응답 FRF (act_measure_frf.py) — 공진·감쇠·강성 ────────────────────
#   ⚠ 다리 미장착 상태의 공진은 배포 조건이 아니다. 관성이 10배면 f_n 이 √10 배
#     낮아져(20 → 6.5 Hz) 200Hz 샘플링에 30점/주기가 되어 훨씬 정확하다.
#     **다리 장착 후에 측정할 것.**
frf:
  clamped: false                      # ★true = 출력축 클램프 고정. 파단토크 제약이
                                      #   풀려 진폭을 2~3배 → SNR 개선(가장 효과적)
  amp_nm_free: 0.45                   # 자유 상태(파단 0.62 Nm 이하 유지)
  amp_nm_clamped: 1.5                 # 클램프 고정 시
  f0_hz: 1.0
  f1_hz: 40.0
  duration_s: 12.0
  reps: 20                            # 동기평균 횟수 — 노이즈가 √N 로 준다
  coherence_min: 0.8                  # γ² 이 이 값 미만인 주파수는 신뢰하지 않는다

# ── 관성 측정(2단 토크법) ────────────────────────────────────────────────────
#   ★순환이 없는 유일한 관성 경로다. kp=kd=0 이라 드라이버가 τ 를 되계산할 항이 없고,
#     우리가 넣은 τ_ff 가 곧 입력이다. 마찰·중력은 τ–q̈ 직선의 **절편**으로 빠지므로
#     마찰 모델이 필요 없다 — 기울기가 곧 I.
#   ⚠준위는 전부 **파단토크 이상**이어야 한다. HL_foot 실측 파단 0.674 Nm(채널).
#     미만이면 안 움직여 표본이 안 잡힌다.
inertia_torque:
  # ★공통속도법 + **q̈~τ 회귀**(x=τ 정확, y=q̈ 잡음). I = 1/기울기.
  #   ⚠반대로(τ~q̈) 놓으면 errors-in-variables 감쇠로 **−19% 편향**이 난다.
  #     마찰 산포가 0 인 합성에서는 안 드러난다(편향 +0.02%) — 실기의 지배적 오차원이
  #     마찰 산포(파단토크 CV 15.6%)라는 걸 알고서야 보였다.
  auto_levels: true           # ★파단토크에서 준위를 **축별로 역산**한다(상수표 금지)
  n_levels: 6                 # 4→6. 회귀 검증력 + errors-in-variables 완화
  u_lo_frac: 0.30             # 최저 순토크 = 파단×0.30 (Stribeck 구간 회피)
  repeats: 2                  # 마찰 산포가 지배적이라 평균으로 낮춘다(σ ∝ 1/√n)
  tau_levels_nm: [0.90, 1.05, 1.20, 1.35]   # auto_levels 실패 시 폴백(HL_foot 기준)
  tau_max_nm: 2.00            # 자동설계가 1.5 Nm 근처까지 올린다
  travel_max_deg: 70.0        # ★방향별 시작점으로 상자 전체를 쓴다(27°→69°)
  box_margin_deg: 3.0         # 한계상자 끝에서 이만큼 안쪽에서 출발
  travel_deg: 27.0            # _ch_box 가 없을 때의 폴백
  vel_cap_dps: 170.0          # vel_trip 200 아래 여유 30
  vref_dps: 100.0             # ★q̈ 를 읽는 공통속도
  win_half_s: 0.05
  skip_s: 0.04
  brake_kp: 30.0
  brake_kd: 2.0

# ── 전축 동시 처프 (PACE 재현매칭 입력) ──────────────────────────────────────
#   ★hip 진폭만 작다. MJCF 로 자기충돌 포락선을 전수(꼭짓점 2^8) 확인한 결과:
#       전축 동일 진폭 ±10° 안전 · **±15° 부터 두 발 충돌**(HL_sphere↔HR_sphere −70mm)
#       **hip 을 ±8° 로 묶으면 나머지는 ±30° 까지 전부 안전**
#     원인은 hip 이다 — 내전하면 발이 모인다.
#   ★f_start/f_end 를 축마다 다르게 준다. 같은 처프를 전 축에 넣으면 궤적이 완전히
#     상관되어 파라미터를 못 가른다(한 축 관성을 키우고 다른 축을 줄여도 같은 궤적).
#     위상은 황금비 수열로 벌린다(재현 가능·균등분포).
pace_multi:
  # ═══════════════════════════════════════════════════════════════════════════
  # ★게인·한계를 **이 시험 전용**으로 따로 둔다. safety/joints 의 배포값을 건드리면
  #   마찰·토크·관성 시험까지 같이 느슨해진다.
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # ── kp: **중력이 허락하는 만큼만** 쓴다 ──────────────────────────────────
  #   ★kp 가 높으면 q 가 q_cmd 에 붙어 **파라미터 정보가 사라진다**(kp→∞ 면 q≡q_cmd).
  #     실측 민감도(ROTOR_I +10% 시 궤적변화): kp 0.2배 0.119° → 1.0배 0.086°.
  #   ★그런데 하한이 있다 — 중력 처짐 = τ_g/kp_joint. 3° 이내로 두려면:
  #         hip 5.25/0.052 = 100 ← **이미 하한**. 못 낮춘다
  #         thigh 2.06 → 40 · calf 0.90 → 17 · foot 0.03 → 1
  #     ⇒ hip·thigh 는 배포값 유지, calf·foot 은 절반으로 낮춰 민감도를 얻는다.
  #   ⚠2026-08-11 한때 "kp 높을수록 민감도가 좋다" 고 적었는데 **틀렸다** —
  #     그 측정은 시뮬이 바닥을 딛고 있어서 나온 인공물이었다(pace_cmaes 주석 참조).
  #   ★하한은 셋이 만든다(모터 기동 아님): ①중력처짐 τ_g/kp ②마찰 데드밴드 τ_c/kp
  #     ③대역 f_n=√(kp·k²/M)/2π ≥ 1.3·f_end. 축마다 지배 요인이 다르다 —
  #     **hip 은 중력(100 이 하한), foot 은 마찰**(21 이 하한).
  #   ⚠한때 foot 을 15 로 잡았는데 하한 21 밑이라 데드밴드가 1.4° 였다 → 22 로 올림.
  #     calf 는 40 이 하한(15) 대비 2.8배라 25 로 낮춰 민감도를 얻는다.
  kp: {0: 100.0, 4: 100.0, 1: 50.0, 5: 50.0, 2: 25.0, 6: 25.0, 3: 22.0, 7: 22.0}
  # ── kd: ζ≈0.7 (kd = 2ζ√(kp_joint·M)/k²). 공진 피크 없이 위상지연 최소 ──
