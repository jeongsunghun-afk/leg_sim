# biped_emb 설정 — 실기(Emb) 배포. 파라미터는 전부 여기(env-var 소거, quad_ctrl 원칙 3).
#   ★단위 규약: SHM 모터 = degree, biped 컨트롤러/MuJoCo = radian. joint_map 이 변환·부호·오프셋 담당.
#   ★부호(sign)·오프셋(offset_deg)은 실기 캘리브레이션 값 = jog 검증으로 축별 확정(초기값 +1 / 0).

meta:
  robot: biped_8dof              # HL/HR × (hip·thigh·calf·foot)
  # ★2026-08-06 정정: biped_flatfoot(평발) → biped_from_quad(**점발**). 배포는 점발이다.
  #   ⚠이 필드는 **현재 코드가 읽지 않는다**(전수 grep 확인). 실제 로드는
  #     biped_wbic.MJCF 기본값 = biped_from_quad.mjcf 이고, model_ctrl 은
  #     BipedMPCWBIC() 를 인자 없이 부른다. 여기 값을 바꿔도 아무 효과가 없다.
  #     → 선언과 실제가 어긋나 있던 것을 실제(점발)에 맞춘 것이지, 동작 변경이 아니다.
  #   두 모델의 차이는 **접촉 geom 뿐**이다(평발은 heel 구 sphere2 추가). 무질량이라
  #   링크 관성·총질량(13.571kg)은 동일 — pace 의 I_link 값은 양쪽에 그대로 유효하다.
  model: ../biped_from_quad.mjcf # 동역학 모델(점발 1pt = 배포). emb/ 기준 상대경로
  ctrl_hz: 500                   # 제어 루프 주기[Hz]. jog=충분, 모델기반 고속보행만 1kHz(→C++ 이관)

  # ── 실장된 채널 ────────────────────────────────────────────────────────────
  #   ★이게 왜 필요한가: **Emb 는 8채널 전부에 대해 status flag 를 세운다.** 모터가
  #     물리적으로 없어도 connected=1, ucStatus=0 으로 보고된다. 그래서 axis_health()
  #     가 미장착 6축을 전부 `ok` 로 판정했고, GUI LED 도 초록으로 떴다 —
  #     **없는 모터가 "정상"으로 보이는 것**이라, 진짜 축이 죽었을 때 그 6개 초록에
  #     묻혀 "8개 중 8개 정상" 이라는 거짓 안심을 준다.
  #   ⇒ 통신 보고로는 장착 여부를 알 수 없으므로 여기서 사람이 선언한다.
  #   ⚠pace/spec.yaml 의 meta.installed_channels 와 **같은 값을 유지**할 것
  #     (한쪽만 고치면 시험 하네스와 배포 앱의 판단이 갈린다).
  #   ⚠축을 새로 연결하면 여기에 채널번호를 추가하고, 그 축의 sign·offset_deg 를
  #     JOG 로 재검증할 것(현재 미장착 6축은 전부 미검증 외삽값이다).
  installed_channels: [0, 1, 2, 3, 4, 5, 6, 7]   # [실측 2026-08-07] 8축 전부 배선·통신 확인

# ── SHM(RobotSharedMem) 백엔드 ──────────────────────────────────────────────
shm:
  lib: /home/rpetubt/simulation/biped/emb/hal/libbipedshm.so  # hal/build_bridge.sh 산출물(Pi)
  n_channel: 10                  # Gait 채널 수(MAX_GaitMOT_CHAN). 0~7=다리, 8~9=허리
  recv_wait_ms: 2000             # 모터 상태 첫 수신 대기(RobotEmbedded 기동 확인). 초과=에러
  imu_deg: true                  # IMU RPY 단위(true=deg). 컨트롤러용 quat 변환 시 사용

# ── 관절 매핑: biped 컨트롤러 순서(0~7) → Gait 채널 ─────────────────────────
#   name    : biped 관절명(= robot_interface.JOINT_NAMES 순서, 고정)
#   channel : RobotSharedMem Gait 채널(ENUM_Gait_JointID)
#   sign    : 실모터 회전방향 = sign · (컨트롤러 각).
#
#   ★★2026-08-10 **8축 전부 장착방향 실측 확정** (다리 조립 후, GUI 슬라이더 + 명령을
#     주고 **실기와 뷰어 모델을 직접 대조**해 판정. 가장 직접적인 기준이다).
#             HL: hip −1 · thigh +1 · calf −1 · foot −1
#             HR: hip −1 · thigh −1 · calf +1 · foot +1
#
#   ⚠ **2026-08-05 의 "hip = +1 실측 확정" 과 모순이 아니다** — 재는 대상이 다르다:
#       2026-08-05 : **모터축 회전방향** (다리 없이 모터 단품. 여전히 유효한 관찰)
#       2026-08-10 : **장착 후 관절 방향** (기구 브라켓·링키지 방향이 더해진 결과)
#     `sign` 은 "컨트롤러 각 → 실제 로봇 움직임" 이므로 **장착방향**이 들어가야 한다.
#     차이(+1 → −1)는 기구 장착이 만든 것이고 둘 다 참이다.
#
#   ★내부 정합 확인: hip 만 좌우 동일(−1/−1)이고 thigh·calf·foot 은 좌우 반대다.
#     2026-08-05 의 "hip 은 **좌우 거울 장착이 아니다**"(두 축을 같은 각도로 움직였을 때
#     같은 방향으로 회전) 와 정확히 일치한다 — 서로 다른 두 시점의 관찰이 맞물린다.
#   ⚠⚠ **알려진 미해결 — 드라이버 감속비 오설정** (2026-08-10 발견, 소프트로 보정하지 않음)
#     드라이버는 모터각을 감속비로 나눠 관절각으로 보고한다(2026-08-05 hip 검증:
#     36° 명령 → 출력축 36° 회전). 그런데 그 감속비가 **전 축 7:1 로 고정**된 것으로 보인다.
#     실제 감속비는 hip/thigh 7 · calf 10.5 · foot 8.4 이므로
#         보고각 = 실제 관절각 × (실제감속비/7)   →  calf 1.5배 · foot 1.2배 과대보고
#     증상: JOG 중 "calf 가 뷰어에서 실제보다 훨씬 많이 움직인다".
#
#     ★소프트 보정(scale)을 **의도적으로 넣지 않는다.** 근본 원인이 드라이버 설정이고,
#       우리 코드에만 보정을 넣으면 (a) 근본 수정이 가려지고 (b) RobotTestGait·mot_test 등
#       다른 도구는 여전히 틀린 채로 남아 **도구마다 각도가 달라진다**.
#     ⇒ 드라이버/MCU 감속비 설정을 고칠 것(RGA 문의). 고쳐지면 아래 offset 만으로 충분하다.
#     ⚠고쳐지기 전까지 **calf·foot 의 표시각·명령각은 실제와 1.5/1.2 배 다르다.**
#       그 축의 각도를 신뢰하지 말 것(방향·부호는 유효하다).
#     ★2026-08-10 **소프트 보정 도입 + 실기 검증** — 각 관절의 `gear_k` 로 보정한다.
#       (calf 10.5/7=1.5 · foot 8.4/7=1.2 · hip/thigh 1.0)
#       적용 후 뷰어와 실기의 회전비율이 일치함을 육안 확인했다.
#       ★★링키지 가설 배제: 4절 링키지라면 배율이 자세마다 달라 **상수** k 로 전 구간이
#         맞을 수 없다. 상수 하나로 맞았다 = 드라이버가 고정 7:1 로 나눈다는 서명이다.
#       ⚠각도기 실측은 아직이라 1.50/1.20 의 소수점 아래는 미확정이다
#         (diag/chain_check.py --axis N --physical). 큰 각도 동작에서 재확인할 것.
#       ⚠아래 "소프트 보정을 넣지 않는다" 는 종전 방침은 **뒤집혔다**. 대가(도구마다
#         각도가 다름)는 그대로이므로 드라이버가 고쳐지면 gear_k 를 1.0 으로 되돌릴 것.
#
#     ★★감속비 오설정의 **파급** 두 가지 — scale 을 안 넣어도 물리적으로 남는다:
#
#       (1) **게인이 설계보다 세게 걸린다.** 드라이버는 tau_보고 = kp·err_채널 을 실행하는데
#           채널오차 = 배율×관절오차, 실제토크 = 보고토크×배율 이므로
#               실제 관절강성 = kp × 배율²
#           calf 설정 50 → **실효 112.5**(2.25배) · foot 30 → 43.2(1.44배).
#           감쇠비도 ζ×배율 로 변한다: calf 0.76→1.13(과감쇠) · foot 0.82→0.97.
#           ⇒ 아래 kp/kd 는 hip·thigh 에서만 설계대로다. 드라이버가 고쳐지면 calf·foot 이
#             갑자기 **약해지므로** 그때 재튜닝할 것(값을 미리 낮춰두지 말 것 — 지금은
#             그 강성으로 실제 동작 중이고 문제도 없다).
#
#       (2) **tau_trip 임계가 축마다 다른 실제토크를 뜻한다.** raw.tau_nm 은 보고 토크라
#           실제 관절토크 = 보고×배율. 설정 15Nm 이 calf 는 실제 22.5Nm · foot 은 18Nm.
#           (피크토크 126/100.8Nm 대비 18% 라 위험하진 않으나 의미가 균일하지 않다.)
#
#   offset_deg: 기계적 0점 보정[deg]. ★캘리브레이션.
#             ★★단위는 **모터(채널)각**이다 — sign 으로 나누기 **전에** 빼기 때문.
#                 모델각 = (모터각 − offset) / sign
#                 모터각 =  모델각 · sign  + offset
#             ⇒ 재는 법: 관절을 **물리적으로 모델 0° 자세**에 놓고, 그때 **모터가 보고하는
#               값**을 그대로 넣는다. sign 은 신경 쓰지 않는다.
#               예) HL_hip(sign=−1): 모델 0°에서 모터가 +3.2° 보고 → offset=3.2
#                   이후 모터 +13.2° → 모델각 (13.2−3.2)/(−1) = −10°
#             ⚠calf·foot 은 감속비 오설정(위 참조)으로 모터각 자체가 실제의 1.5/1.2 배라,
#               지금 offset 을 재도 드라이버 수정 후 **다시 재야 한다**. hip·thigh 부터 할 것.
#   min/max_deg: 소프트웨어 관절한계[deg](MJCF range 변환). 명령·jog 모두 클램프
#   kp/kd   : jog·hold 시 모터 임피던스 게인(모델기반은 tau_ff, kp/kd=0)
#
#   ★★게인 단위 (2026-08-05 실기 실측). 드라이버 MIT 법칙은
#        tau[Nm] = Kp·(q_des − q)[rad] + Kd·(dq_des − dq)[rad/s]
#     명령/상태는 deg 지만 게인은 rad 기준 → Kp 1 당 0.0175 Nm/deg 밖에 안 된다.
#     실측(ch0=HL_hip): err 4.743deg(0.0828rad), vel 0.61deg/s, Kp10/Kd5
#        → 예측 10·0.0828 − 5·0.0106 = 0.775 Nm, 실측 0.757 Nm (오차 2%).
#     ⇒ 종전 kp8 은 1° 오차당 0.14 Nm 로 힙 관절 정지마찰조차 못 이긴다
#       (±5° 명령에 실제 ±0.7° 만 움직여 "모터 무반응" 으로 오인했던 원인).
#     실측 정합: kp25 → ±4°, kp40/kd2 → 추종지연 1.4°, kp60/kd3 → 1.2°(채터 없음).
#   ⇒ hip 은 kp40/kd2 로 확정(실측). 나머지 축은 미장착이라 동일비율(×5) 외삽값이므로
#     장착 후 축별로 mot_test 로 재검증할 것. ⚠Kd 는 속도 노이즈(±15deg/s 관측)를
#     그대로 토크로 증폭하므로(kd2 → ±0.5Nm) 함부로 올리지 말 것.
joints:
  # ══ ★2026-08-07 게인 상향 적용 — 다리 조립 후 처짐 대항 ═══════════════════════
  #   적용: kp **hip 100 / thigh 50 / calf 50 / foot 30**, kd **5.0 전축** (종전 40/40/40/30, kd 2/2/2/1.5)
  #
  #   ★출처가 확인됐다 — 이건 임의값이 아니라 **Emb 펌웨어가 이미 쓰는 값**이다:
  #     ZSource/RobotEmbedded/modules/ctrlGait/halGait.cpp:694-711
  #       LtR(hip) Kp=100 · LtP(thigh) Kp=50 · LkP(knee) Kp=50 · LaP(ankle) Kp=20 · Kd=5.0 전축
  #     Emb 는 기동 시 4.5초 램프에서 이 게인으로 전 관절을 0°로 보낸다. 즉 **이 로봇에서
  #     실제로 동작이 검증된 게인**이다. (발목만 20 vs 우리 30 — 우리가 약간 높다)
  #
  #   MJCF 중력토크로 교차검증한 결과 **이 방향이 물리적으로 맞다**:
  #     축     중력토크   kp40 처짐 → 제안 kp   처짐     개선
  #     hip     4.96 Nm    7.1°      100      2.8°     2.5배   ← 가장 많이 처지는 축
  #     thigh   1.93 Nm    2.8°       50      2.2°     1.2배
  #     calf    0.83 Nm    1.2°       50      0.9°     1.2배
  #     foot    0.03 Nm    0.1°       30      0.1°       —     (원래 부하 없음)
  #   hip 이 중력토크가 제일 크고(다리 전체를 roll 로 듦) 실기에서도 hip 을 가장 많이
  #   올렸다는 점이 일치한다. 근거 있는 튜닝이다.
  #
  #   ★kd 는 **축별로 계산**해 넣었다(6.0/4.0/3.5/2.0). kp 만 올리면 진동한다 —
  #     감쇠비 ζ = kd/(2√(kp·I)) 계산(armature 7.4e-4 포함 등가관성):
  #       hip   kp40/kd2 ζ=0.36 → kp100/kd2 ζ=**0.23**(심한 저감쇠) → kp100/kd5 ζ=0.57 ✅
  #       thigh 0.40 → 0.36 → 0.90   calf 0.48 → 0.43 → 1.06   foot 0.68 → 0.78 → 1.96
  #   ★kd 산출: 목표 감쇠비 ζ≈0.7~0.8 에서  kd = 2ζ√(kp·I) − JDAMP(0.09)
  #     I 는 armature(ROTOR_I·N²) 포함 등가관성 = MJCF 질량행렬 대각성분(홈자세 q=0):
  #       hip 0.1951 · thigh 0.1557 · calf 0.1104 · foot 0.0542 kg·m²
  #     채택값의 실제 ζ:  hip 0.69 · thigh 0.73 · calf 0.76 · foot 0.82
  #     ⚠Emb 펌웨어의 **균일 kd=5 는 축별로 안 맞는다** — hip ζ=0.58(저감쇠)/foot ζ=2.00(과감쇠).
  #       Emb 는 4.5초 램프용이라 그 정도로 충분하지만, 우리는 축별로 잡는 게 맞다.
  #     ⚠자세 의존: 무릎을 굽히면 hip/thigh 관성이 +15~16% → ζ 가 0.80→0.74 로 약간 내린다.
  #       설계 여유 안이다(ζ 0.7 이상 유지).
  #   ⚠대가 — 속도노이즈 증폭: 실측 σ_dq=2.11 dps(p-p 14.6)가 kd 배로 토크 리플이 된다.
  #     채택값의 p-p 리플: hip 1.53 · thigh 1.02 · calf 0.89 · foot 0.51 Nm.
  #     정지마찰(0.5 Nm)을 넘으므로 **소리·발열로는 떨림이 난다**.
  #     ★그러나 위치로는 거의 안 나타난다 — 이 노이즈는 고주파라 관성이 걸러낸다.
  #       변위 ≈ T/(I·ω²): hip 1.53 Nm @100Hz → 0.0013° (엔코더 분해능 0.0044° 이하).
  #       ⇒ 눈에 보이는 떨림이 실제로 생기면 그건 노이즈가 아니라 **저감쇠(ζ 부족)**
  #         이거나 게인 과다다. kd 를 올릴 게 아니라 kp 를 내리고 다시 볼 것.
  #     거슬리면 kd 를 ζ=0.7 선(hip 6.1/thigh 3.8/calf 3.2/foot 1.7)까지만 내릴 수 있다.
  #
  #   ⚠ **safety.tau_trip_nm 을 8 → 15 로 같이 올렸다**(아래 safety 절). 안 올리면 못 쓴다:
  #     kp100 에서 8 Nm 는 **4.58° 오차**에 트립인데 중력 처짐만 2.84° → 여유 1.74° 뿐이라
  #     JOG 첫 동작에서 바로 E-stop 이 난다.
  #   ⚠ PACE 하네스(pace/spec.yaml)의 `gains.kp_max: 60` 은 **그대로 뒀다**. PACE 는 자체
  #     게인(kp40)으로 돌고 이 config 를 안 읽는다 — 충돌이 아니다. PACE 를 이 게인으로
  #     돌릴 거면 그때 kp_max 를 재검토할 것(강성 실측 상한은 41~97, quad_ctrl e780b04).
  # ═══════════════════════════════════════════════════════════════════════════════
  - {name: HL_hip,   channel: 0, sign: -1, offset_deg: -1.39, min_deg: -35, max_deg:  35, kp: 100, kd: 6.0, gear_k: 1}  # ★sign 장착방향 실측확정 2026-08-10
  - {name: HL_thigh, channel: 1, sign:  1, offset_deg: -31.03, min_deg: -135, max_deg: 65, kp: 50, kd: 4.0, gear_k: 1}  # ★sign 장착방향 실측확정 2026-08-10
  - {name: HL_calf,  channel: 2, sign: -1, offset_deg: -66.62, min_deg: -62, max_deg:  65, kp: 50, kd: 3.5, gear_k: 1.5}  # ★sign 장착방향 실측확정 2026-08-10
  - {name: HL_foot,  channel: 3, sign: -1, offset_deg: -85.19, min_deg: -80, max_deg:  62, kp: 30, kd: 2.0, gear_k: 1.2, couple_from: HL_calf, couple_coef: 1}  # ★sign 장착방향 실측확정 2026-08-10
  - {name: HR_hip,   channel: 4, sign: -1, offset_deg: 0.94, min_deg: -35, max_deg:  35, kp: 100, kd: 6.0, gear_k: 1}  # ★sign 장착방향 실측확정 2026-08-10
  - {name: HR_thigh, channel: 5, sign: -1, offset_deg: 34.44, min_deg: -135, max_deg: 65, kp: 50, kd: 4.0, gear_k: 1}  # ★sign 장착방향 실측확정 2026-08-10
  - {name: HR_calf,  channel: 6, sign:  1, offset_deg: 77.20, min_deg: -62, max_deg:  65, kp: 50, kd: 3.5, gear_k: 1.5}  # ★sign 장착방향 실측확정 2026-08-10
  - {name: HR_foot,  channel: 7, sign:   1, offset_deg: 87.69, min_deg: -80, max_deg:  62, kp: 30, kd: 2.0, gear_k: 1.2, couple_from: HR_calf, couple_coef: 1}  # ★sign 장착방향 실측확정 2026-08-10

# 허리(WaR/WaP, 채널 8~9)는 biped 모델에 없음 → 고정 홀드. ★상체/허리 서브시스템 별도면 여기서 제외.
waist:
  channels: [8, 9]
  hold_deg: [0.0, 0.0]           # 홀드 목표각
  kp: 50                         # 외삽(미장착) — 위 게인 단위 주석 참조
  kd: 2.5

# ── jog(각축 검증) ──────────────────────────────────────────────────────────
#   안전 우선: 저속 위치 램프. GUI가 축별 목표각(deg) 발행 → 여기 속도·한계로 제한.
jog:
  max_speed_dps: 20.0            # 축 최대 각속도[deg/s] — 천천히(안전)
  # ★0.5 → 1.0 (2026-08-10). 0.5 는 "영점이 안 잡혀 있으니 **모델 0 근처만** 허용" 이라는
  #   전제의 안전마진이었다. 영점을 잡고 나니 정지자세가 0 인 축이 거의 없어(calf −60°,
  #   foot 60°) 그 전제가 깨졌다 — thigh 는 위쪽 여유가 5°, foot 은 2° 밖에 안 남아
  #   각축 검증 자체가 불가능했다.
  #   ⇒ 이제 jog 한계 = 관절한계(min/max_deg)다. 그 값들은 MJCF range + 실측 보정이라
  #     소프트웨어 한계로서 이미 올바른 기준이다. 채널각 ±180 도 전 축 여유 안이다
  #     (최대 HR_thigh 169.4 · HR_calf 174.7 · foot 180.0 — foot 은 극단 조합에서만 닿는다).
  #   ⚠hip·thigh 의 관절한계는 MJCF 유래라 **물리 하드스톱과 대조된 적이 없다**(calf·foot 은
  #     실측으로 −62/+62 로 넓혔다). 끝단까지 몰기 전에 눈으로 확인할 것.
  #   축별로 다시 좁히려면 joints 항목에 jog_min_deg / jog_max_deg 를 넣으면 된다.
  range_frac: 1.0
  settle_deg: 0.5               # 목표 도달 판정[deg]

# ── home(홈 복귀) ───────────────────────────────────────────────────────────
#   GUI 의 [Home 복귀] 버튼 → 전 축이 **동시에 출발·동시에 도착**하는 S-curve(5차식)
#   궤적으로 q_deg 자세까지 이동. 구현·수식은 control/home.py 참조.
#
#   ★jog 와 뭐가 다른가: jog 는 등속 램프(max_speed_dps 로 잘라내기)라 출발·도착
#     순간의 **가속도가 불연속**이다 — 토크 지령이 계단으로 튄다. home 은 경계에서
#     속도·가속도가 모두 0 인 5차식이라 그 계단이 없다. 여러 축을 한꺼번에 움직이는
#     복귀 동작에서 이 차이가 커진다(jog 는 축마다 도착시각이 제각각이기도 하다).
#
#   ★한계는 실제로 지켜진다. 5차식의 최대속도는 1.875·d/T, 최대가속도는 5.7735·d/T²
#     라서 소요시간 T 를 이 둘에서 역산한다(control/home.py 의 S_VMAX/S_AMAX).
#     ⇒ 아래 두 값은 "대략" 이 아니라 궤적이 실제로 찍는 상한이다.
home:
  # 홈 자세[deg] — 관절 순서는 위 joints (HL_hip,thigh,calf,foot, HR_…) 와 동일.
  #
  #   ★2026-08-10 영점 캘리브레이션과 함께 갱신: 전축 0 → calib.ref_joint_deg 와 동일하게.
  #     종전 전축 0 은 offset 이 전부 0 이던 시절 "채널 0 = 모델 0" 이라는 우연에 기대고
  #     있었다. 영점을 잡고 나니 calf 의 정지 자세가 모델 −55°(구조적 한계)로 드러났고,
  #     그 상태에서 홈 목표가 0 이면 **HOME 을 누르는 순간 양 무릎이 55° 펴진다**(6.9초).
  #     캘리브레이션 직후에 그건 의도한 동작이 아니라 사고에 가깝다.
  #   ⇒ 지금 홈 = **기준자세(= 현재 정지 자세) 로 복귀**. HOME 이 안전한 "제자리로" 가 된다.
  #   ⚠기립 자세(무릎 굽힘)로 바꾸는 건 그 다음 단계다. 바꾸기 전에 확인할 것:
  #       (a) calf 감속비 오설정(1.5배) 수정 — 안 고치면 명령 55° 가 실제 36.7° 다
  #       (b) 그 자세에서 다리가 실제로 몸을 지탱하는지(지금은 공중 매달림 상태)
  #   ⚠jog 안전한계 밖 값을 쓰면 클램프되고 기동 시 경고가 뜬다(calf 는 축별 예외로
  #     jog_min_deg −55 를 줘서 −55 가 한계 안이다).
  # ★foot 목표만 0 (2026-08-10 사용자 지정). 영점(calib.ref_joint_deg)은 그대로 60 이다 —
  #   영점은 '이 자세를 몇 도라 부를까'(캘리브레이션)이고, 홈은 '어디로 갈까'(목표)라
  #   서로 달라도 된다. 이제 홈 ≠ 기준자세이므로 HOME 을 누르면 발목이 실제로 움직인다.
  q_deg: [0.0, 35.0, -60.0, 0.0, 0.0, 35.0, -60.0, 0.0]
  max_speed_dps: 15.0            # 궤적 최대 각속도[deg/s]. jog(20)보다 보수적으로
  max_acc_dps2: 30.0             # 궤적 최대 각가속도[deg/s²]
  min_time_s: 0.6                # 아주 가까운 거리라도 최소 이 시간은 쓴다(순간이동 방지)
  settle_deg: 0.5                # 홈 도달 판정[deg] — **측정각** 기준(명령각이 아니라)

# ── 영점 캘리브레이션 기준자세 ──────────────────────────────────────────────
#   diag/calib_zero.py 가 이 값을 써서 offset_deg 를 계산한다.
#       offset = 채널각(기준자세) − ref_joint_deg · sign
#   즉 "로봇을 아래 자세에 물리적으로 놓았을 때, 뷰어/GUI 가 이 숫자로 읽혀야 한다".
#   ⇒ ref 가 0 인 축은 offset 이 곧 **그때의 채널각 그대로**다.
#
#   ★calf 만 −55 인 이유 (2026-08-10): 조립된 실기에서 무릎이 구조적 한계에 닿아 있고,
#     그 자세가 MJCF 모델각 −55°(= calf 의 min_deg) 에 해당한다. 나머지 축은 그 자세에서
#     모델각 0° 다.
#   ⚠calf 는 드라이버 감속비 오설정(7:1 가정, 실제 10.5) 축이라 보고각이 실제의 1.5배다.
#     이 offset 은 **−55° 그 지점에서만** 정확하고, 모델 0° 부근에선 약 27.5° 틀어진다.
#     ⇒ 드라이버 감속비를 고친 뒤 **반드시 재측정**할 것. foot(8.4, 1.2배)도 동일 주의.
calib:
  ref_joint_deg: [0.0, 35.0, -60.0, 60.0, 0.0, 35.0, -60.0, 60.0]

# ── 안전 ────────────────────────────────────────────────────────────────────
safety:
  tau_max_frac: 0.6             # 모델기반 토크를 actuatorfrcrange 의 이 비율로 클램프
  tilt_estop_deg: 40            # 기울기 초과 시 안전정지(limp)
  # ★100 → 500. GUI 하트비트가 20Hz(50ms)이므로 10 beat 여유.
  #   ⚠순서 주의: 워치독이 데드코드이던 것을 살렸고(biped_emb.read_cmd_fresh) GUI 에
  #     하트비트를 넣었다. 이 둘이 갖춰지기 **전에** 이 값을 줄이면 jog 램프처럼
  #     이벤트가 뜸한 구간(20dps 로 30° = 1.5초 무이벤트)에서 매번 limp 로 떨어진다.
  watchdog_ms: 500              # 명령 채널 무응답 이 시간 초과 시 홀드→limp

  # ★2026-08-05 추가 — 토크/속도 트립.
  #   배경: 이 임계값들은 emb/pace/hwio.py 에 **이미 있었고 실측으로 확정**돼 있었는데
  #   배포 앱(app/biped_emb.py)은 하나도 쓰지 않았다. raw.tau_nm / raw.dq_dps 를 매 틱
  #   읽어놓고 안전 판정에 전혀 반영하지 않았다. tilt E-stop 은 IMU 가 전부 0 이라 무력하므로
  #   (위 tilt_estop_deg 참조) 실질적인 런타임 보호가 **워치독 하나뿐**이었다.
  #   ⇒ 시험 하네스에서 검증된 값을 배포 앱으로 승격한다.
  # ★2026-08-07: 8.0 → 15.0. 게인 상향(kp hip 100)과 다리 장착의 필연적 결과다.
  #   kp100 에서 토크 T[Nm] 에 대응하는 오차각 = T/(100·π/180) = T·0.573°
  #     8 Nm  → 4.58° 인데 **중력 처짐만 2.84°** → 여유 1.74° → JOG 첫 동작에 오트립
  #     15 Nm → 8.59° → 중력 제외 5.75° 여유. 실측 추종지연(kp40 에서 1.4°)을 충분히 수용
  #   여전히 보수적이다: hip 피크토크 84 Nm 의 18% 에 불과하다.
  #   ⚠ err_max 12° 는 kp100 에서 20.9 Nm 라 **토크트립이 항상 먼저 걸린다**(의도된 순서 —
  #     토크가 물리적으로 의미 있는 양이다). err_max 는 사실상 2차 방어선이 됐다.
  tau_trip_nm: 15.0             # 채널 토크 절대값 임계[Nm]. 실측 정지마찰 0.71 / 파단 0.62~0.67
                                #   대비 10배 이상 여유. ⚠다리 장착 후 재검토(부하가 달라진다)
  tau_trip_ms: 50               # 위 임계를 이 시간 이상 **연속** 초과해야 트립(순간 스파이크 무시)
  vel_trip_dps: 200.0           # 채널 속도 절대값 임계[deg/s].
                                #   실측 노이즈 sigma 2.11 dps · p-p 14.6 dps 대비 충분히 위.
                                #   ⚠sigma 와 p-p 를 구분할 것(과거 문서에 ±15dps 로 혼선 있었음)
